name: Publish article

# The app sends a finished article here. The images are downloaded server-side,
# which avoids the browser's cross-origin limits and keeps the bytes for good.
on:
  repository_dispatch:
    types: [publish-article]

permissions:
  contents: write

concurrency:
  group: publish-article
  cancel-in-progress: false

jobs:
  save:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - id: save
        run: node .github/scripts/save-article.mjs
        env:
          CLIENT_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
          REPO_NAME: ${{ github.event.repository.name }}

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/content
          if git diff --staged --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git commit -m "Publish: ${{ steps.save.outputs.concept }}"
          git push

  deploy:
    needs: save
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
